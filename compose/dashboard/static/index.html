<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>spark: topologia</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #12161c; color: #dde; }
  #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 8px 14px; background: #0008; display: flex; gap: 18px; font-size: 13px; align-items: center; }
  #cy { position: absolute; inset: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #legend { position: absolute; bottom: 10px; right: 10px; z-index: 2; background: #000a; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
  #legend div { margin: 3px 0; }
  #legend i { display: inline-block; width: 28px; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
  #info { position: absolute; bottom: 10px; left: 10px; z-index: 2; background: #000a; padding: 8px 12px; border-radius: 6px; font-size: 12px; white-space: pre; max-width: 420px; }
</style>
</head>
<body>
<div id="bar">
  <b>spark</b><span id="summary">ładowanie…</span>
  <span><i class="dot" style="background:#3fb950"></i>działa</span>
  <span><i class="dot" style="background:#d29922"></i>start/problem</span>
  <span><i class="dot" style="background:#f85149"></i>zatrzymany</span>
  <span id="stamp" style="margin-left:auto;opacity:.6"></span>
</div>
<div id="cy"></div>
<div id="legend"></div>
<div id="info">kliknij węzeł lub strzałkę</div>
<script>
const COLORS = { "spark-master": "#e25a1c", "spark-worker": "#f0a04b", cassandra: "#1287b1", neo4j: "#4c8eda",
  hub: "#f37726", notebook: "#9b6dd6", ldap: "#888", nfs: "#b0a060", tunnel: "#2ea6a6", dashboard: "#7a8", other: "#666",
  proxy: "#3aa17e", gateway: "#3aa17e", hdfs: "#d6b341", monitoring: "#7d7fb3" };
const EDGE = { spawns: ["#9b6dd6", "dotted"], spark: ["#e25a1c", "solid"], data: ["#4c8eda", "solid"],
  registered: ["#f0a04b", "solid"], tunnel: ["#2ea6a6", "dashed"], http: ["#3aa17e", "solid"],
  provision: ["#778", "dashed"], monitor: ["#7d7fb3", "dashed"] };
const EDGE_INFO = {
  http: ["ruch HTTP(S)", "nginx przekazuje ruch do huba i do paneli administracyjnych"],
  spawns: ["utworzył kontener", "JupyterHub uruchomił ten notebook (DockerSpawner)"],
  spark: ["zadania Spark", "sterownik (notebook lub SSH) zleca zadania masterowi; executory działają na workerach"],
  data: ["dostęp do danych", "notebook czyta i zapisuje dane (HDFS, Cassandra, Neo4j)"],
  registered: ["rejestracja", "worker rejestruje się w masterze Sparka, DataNode w NameNode"],
  provision: ["zakładanie kont", "hub zakłada przy logowaniu rolę w Cassandrze i katalog w HDFS"],
  monitor: ["metryki", "Grafana czyta metryki z Prometheusa (Prometheus zbiera je ze wszystkich usług)"],
  tunnel: ["tunel do klastra", "zdalny node łączy się z klastrem przez tunel wss + ssh (wan-gw)"],
};
const statusColor = s => s === "running" ? "#3fb950" : (s === "exited" || s === "dead" || s === "down") ? "#f85149" : "#d29922";

const cy = cytoscape({
  container: document.getElementById("cy"),
  wheelSensitivity: 0.3,
  style: [
    { selector: "node[kind]", style: { label: "data(label)", color: "#fff", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4,
        "background-color": "data(color)", "border-width": 4, "border-color": "data(border)", width: 46, height: 46 } },
    { selector: ":parent", style: { label: "data(label)", "text-valign": "top", "background-opacity": 0.08, "background-color": "#8af",
        "border-width": 1, "border-color": "#8af", "border-style": "dashed", shape: "round-rectangle", "font-size": 14, padding: 24, color: "#9bd" } },
    { selector: "node[id ^= 'grp:']", style: { "background-opacity": 0.05, "border-style": "solid", "border-width": 1, "border-color": "#556", "font-size": 12, color: "#89a", padding: 22 } },
    { selector: "edge", style: { width: 2, "curve-style": "taxi", "taxi-direction": "auto", "taxi-turn": 40, "taxi-turn-min-distance": 12, "target-arrow-shape": "triangle", "line-color": "data(color)",
        "target-arrow-color": "data(color)", "line-style": "data(style)", opacity: 0.85 } },
    { selector: "edge:selected", style: { width: 4, opacity: 1 } },
    { selector: "node[kind]", style: { "z-index-compare": "manual", "z-index": 10 } },
    { selector: "edge", style: { "z-index-compare": "manual", "z-index": 1, opacity: 0.6 } },
    { selector: ".faded", style: { opacity: 0.1 } },
    { selector: "edge.hl", style: { opacity: 1, width: 3.5 } },
  ],
});

// Warstwy (kolumny) od wejścia do danych; w obrębie warstwy węzły są porządkowane wg sąsiadów, żeby krawędzie się nie plątały
const TIER = { proxy: 0, gateway: 0, hub: 1, notebook: 1, "spark-master": 2, "spark-worker": 2, tunnel: 2,
  hdfs: 3, cassandra: 3, neo4j: 3, monitoring: 4, dashboard: 4, ldap: 4, nfs: 4, other: 4 };
const TIER_NAME = ["wejście", "użytkownicy", "obliczenia (Spark)", "dane", "monitoring i administracja"];
const ORDER = ["proxy", "gateway", "hub", "notebook", "spark-master", "spark-worker", "tunnel", "hdfs", "cassandra", "neo4j",
  "monitoring", "dashboard", "ldap", "nfs", "other"];
const DX = 230, DY = 100;

function layout(nodes, edges) {
  const main = (nodes.find(n => n.kind === "spark-master") || nodes[0]).host;
  const others = [...new Set(nodes.map(n => n.host))].filter(h => h !== main).sort();
  const tierOf = n => n.host === main ? (TIER[n.kind] ?? 4) : 5 + others.indexOf(n.host);
  const cols = {};
  nodes.forEach(n => (cols[tierOf(n)] ||= []).push(n));
  const base = n => ORDER.indexOf(n.kind) * 1000 + n.id.charCodeAt(0);
  // koordynator (NameNode, master Sparka) w środku swoich pomocników, żeby krawędzie się nie nakładały
  const mid = (c, kind, hub) => {
    const hubN = c.find(n => n.id === hub), helpers = c.filter(n => n.kind === kind && n.id !== hub);
    if (!hubN || !helpers.length) return c;
    const h = Math.ceil(helpers.length / 2), at = c.findIndex(n => n.kind === kind);
    const rest = c.filter(n => n.kind !== kind && n.id !== hub);
    rest.splice(at < 0 ? rest.length : Math.min(at, rest.length), 0, ...helpers.slice(0, h), hubN, ...helpers.slice(h));
    return rest; };
  const hdfsMid = c => mid(mid(c, "hdfs", "namenode"), "spark-worker", "spark-master");
  Object.values(cols).forEach(c => c.sort((a, b) => base(a) - base(b) || a.id.localeCompare(b.id)));
  Object.keys(cols).forEach(t => cols[t] = hdfsMid(cols[t]));
  const idx = {}, ncols = Object.keys(cols).map(Number).sort((a, b) => a - b);
  const reindex = () => ncols.forEach(t => cols[t].forEach((n, i) => idx[n.id] = (i + 0.5) / cols[t].length));
  const nb = {};
  edges.forEach(e => { (nb[e.source] ||= []).push(e.target); (nb[e.target] ||= []).push(e.source); });
  reindex();
  // kilka przejść: kolumna sortowana wg średniej pozycji sąsiadów z kolumn już ustawionych (barycentrum)
  for (let pass = 0; pass < 6; pass++) {
    (pass % 2 ? [...ncols].reverse() : ncols).forEach(t => {
      const bc = n => { const v = (nb[n.id] || []).filter(m => tierOf({ id: m, ...nodes.find(x => x.id === m) }) !== t && idx[m] !== undefined).map(m => idx[m]);
        return v.length ? v.reduce((a, b) => a + b) / v.length : idx[n.id]; };
      cols[t].sort((a, b) => bc(a) - bc(b) || base(a) - base(b));
      cols[t] = hdfsMid(cols[t]);
      cols[t].forEach((n, i) => idx[n.id] = (i + 0.5) / cols[t].length);
    });
  }
  const rows = Math.max(...ncols.map(t => cols[t].length));
  const pos = {};
  ncols.forEach(t => cols[t].forEach((n, i) => {
    pos[n.id] = { x: t * DX, y: (i - (cols[t].length - 1) / 2) * DY + (rows * DY) / 2 + (t % 2) * DY / 2 };
  }));
  return { pos, tierOf, main };
}

let signature = "";
async function refresh() {
  let g;
  try { g = await (await fetch("api/graph")).json(); } catch (e) { document.getElementById("summary").textContent = "brak połączenia z API"; return; }
  if (g.error) { document.getElementById("summary").textContent = g.error; return; }

  const hosts = [...new Set(g.nodes.map(n => n.host))];
  const { pos, tierOf, main } = layout(g.nodes, g.edges);
  const groups = [...new Set(g.nodes.map(n => `${n.host}|${tierOf(n)}`))];
  const elements = [
    ...hosts.map(h => ({ data: { id: "host:" + h, label: "node: " + h } })),
    ...groups.map(k => { const [h, t] = k.split("|"); return { data: { id: "grp:" + k, parent: "host:" + h, label: h === main ? TIER_NAME[t] : "" } }; }),
    ...g.nodes.map(n => ({ position: pos[n.id], data: { ...n, parent: `grp:${n.host}|${tierOf(n)}`, color: COLORS[n.kind] || "#666", border: statusColor(n.status) } })),
    ...g.edges.map(e => ({ data: { id: `${e.source}>${e.target}:${e.kind}`, ...e, color: EDGE[e.kind][0], style: EDGE[e.kind][1] } })),
  ];
  const sig = elements.map(e => e.data.id).sort().join("|");
  if (sig !== signature) {
    signature = sig;
    cy.elements().remove();
    cy.add(elements);
    cy.layout({ name: "preset", fit: true, padding: 50 }).run();
  } else {
    elements.forEach(e => cy.getElementById(e.data.id).data(e.data));
  }
  const w = g.nodes.filter(n => n.kind === "spark-worker").length;
  const nb = g.nodes.filter(n => n.kind === "notebook").length;
  const m = (g.nodes.find(n => n.id === "spark-master") || {}).spark;
  document.getElementById("summary").textContent =
    `${hosts.length} node(ów) · ${w} worker(ów) · ${nb} notebook(ów)` + (m ? ` · rdzenie ${m.coresused}/${m.cores} · aplikacje ${m.apps}` : "");
  document.getElementById("stamp").textContent = new Date(g.time * 1000).toLocaleTimeString();
}
cy.on("tap", "node[kind]", ev => {
  const d = ev.target.data();
  document.getElementById("info").textContent =
    [`${d.label} (${d.kind})`, `status: ${d.status}`, `node: ${d.host}`, `ip: ${d.ip || "-"}`, d.image && `obraz: ${d.image}`,
     d.spark && JSON.stringify(d.spark)].filter(Boolean).join("\n");
});
document.getElementById("legend").innerHTML = Object.entries(EDGE_INFO).map(([k, [name]]) =>
  `<div><i style="border-color:${EDGE[k][0]};border-top-style:${EDGE[k][1]}"></i>${name}</div>`).join("");
cy.on("tap", "edge", ev => {
  const d = ev.target.data(), [name, desc] = EDGE_INFO[d.kind];
  document.getElementById("info").textContent = `${d.source} → ${d.target}\n${name}\n${desc}`;
});
// po najechaniu na węzeł podświetlamy tylko jego połączenia, reszta blaknie
cy.on("mouseover", "node[kind]", ev => {
  const n = ev.target, hood = n.closedNeighborhood();
  cy.elements().not(":parent").addClass("faded");
  hood.removeClass("faded"); n.connectedEdges().addClass("hl");
});
cy.on("mouseout", "node[kind]", () => { cy.elements().removeClass("faded").removeClass("hl"); });
cy.on("mouseover", "edge", ev => ev.target.addClass("hl"));
cy.on("mouseout", "edge", ev => ev.target.removeClass("hl"));
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
