global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["10.78.0.5:9090"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs: [{targets: ["spark-master:8080"]}]
  - job_name: spark-applications
    metrics_path: /metrics/applications/prometheus/
    static_configs: [{targets: ["spark-master:8080"]}]
  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs: [{targets: ["spark-worker:8081", "spark-worker-2:8081"]}]
  - job_name: hdfs-namenode
    static_configs: [{targets: ["namenode:9101"]}]
  - job_name: hdfs-datanode
    static_configs: [{targets: ["datanode:9101", "datanode2:9101"]}]
  - job_name: jupyterhub
    metrics_path: /hub/metrics
    static_configs: [{targets: ["jupyterhub:8000"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: containers
    static_configs: [{targets: ["cadvisor:8080"]}]
