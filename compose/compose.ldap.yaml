# Nakładka na compose.yaml: logowanie przez LDAP, UID/GID z LDAP, wspólny /home.
# Adres i parametry LDAP-a pochodzą z .env (domyślnie symulacja z compose.ldap-demo.yaml):
#   LDAP_URI, LDAP_BASE_DN, LDAP_USER_SEARCH_BASE, LDAP_BIND_DN, LDAP_BIND_PASSWORD, LDAP_TLS_REQCERT, LDAP_CA_FILE
# Uruchomienie z symulowanym LDAP: docker compose -f compose.yaml -f compose.ldap.yaml -f compose.ldap-demo.yaml up -d

services:
  cassandra:
    command:
      - sh
      - -c
      - >-
        sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/;
        s/^authorizer:.*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p ${CASSANDRA_ADMIN_PASSWORD:-cassandra} -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  jupyterhub:
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      AUTH_MODE: ldap
      LDAP_URI: ${LDAP_URI:-ldap://openldap}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=poc,dc=local}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN-cn=admin,dc=poc,dc=local}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD-${LDAP_ADMIN_PASSWORD:-ldapadmin}}
      LDAP_TLS_REQCERT: ${LDAP_TLS_REQCERT:-demand}
      LDAP_CA_FILE: ${LDAP_CA_FILE:+/etc/jupyterhub/ldap-ca.pem}
      HUB_ADMINS: ${HUB_ADMINS:-4alice}
      ACCESS_GROUP: ${ACCESS_GROUP:-sparkusers}
      CASSANDRA_HOST: cassandra
      CASSANDRA_ADMIN_USER: cassandra
      CASSANDRA_ADMIN_PASSWORD: ${CASSANDRA_ADMIN_PASSWORD:-cassandra}
      CASSANDRA_PASSWORD_SECRET: ${CASSANDRA_PASSWORD_SECRET:-poc-secret-change-me}
    volumes:
      - homes:/home
      - nss:/nss
      - ${HOST_ETC_DIR:-./access/demo-etc}:/host-etc:ro
      - ${LDAP_CA_FILE:-./ldap/no-ca.pem}:/etc/jupyterhub/ldap-ca.pem:ro

volumes:
  homes:
  nss:
