# Vhost na nas: JupyterHub z sandboxa (192.0.2.10:8000).
# Logowanie odbywa się w samym JupyterHubie (LDAP), bez authentika przed nim.
server {
    listen 80;
    server_name hub.sandbox.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hub.sandbox.example.org;

    include /etc/nginx/snippets/ssl-gizanet.conf;
    include snippets/custom-ssl.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 200M;

    location / {
        proxy_pass http://192.0.2.10:8000;
        include snippets/proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
