# Vhost na nas: dashboard topologii za logowaniem authentika (embedded outpost, jak w "convert").
# Upstream: dashboard na sandboxie (192.0.2.10:8088).
server {
    listen 80;
    server_name spark.sandbox.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name spark.sandbox.example.org;

    include /etc/nginx/snippets/ssl-gizanet.conf;
    include snippets/custom-ssl.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @spark_logowanie;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;
        add_header       Strict-Transport-Security "max-age=31536000" always;

        proxy_pass http://192.0.2.10:8088;
        include snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
    }

    location /outpost.goauthentik.io {
        proxy_pass              http://127.0.0.1:9000/outpost.goauthentik.io;
        proxy_set_header        Host $ak_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Original-URL $scheme://$ak_host$request_uri;
        add_header              Set-Cookie $auth_cookie;
        auth_request_set        $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location @spark_logowanie {
        internal;
        add_header Set-Cookie $auth_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$ak_host$request_uri;
    }
}
